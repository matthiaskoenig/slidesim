name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y mpich libmpich-dev pkg-config python3
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install wasi-sdk
        # bindgen uses wasi-sdk's libclang for every target (petsc-sys/build.rs).
        run: |
          . deps/versions.env
          WASI_SDK_PATH="$RUNNER_TEMP/wasi-sdk"
          mkdir -p "$WASI_SDK_PATH"
          curl -fsSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz" \
            | tar xz --strip-components=1 -C "$WASI_SDK_PATH"
          echo "WASI_SDK_PATH=$WASI_SDK_PATH" >> "$GITHUB_ENV"
      - name: Cache native dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps/install
          key: deps-${{ runner.os }}-${{ hashFiles('deps/versions.env', 'scripts/deps/*') }}
      - name: Build native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: scripts/deps/build-native.sh debug
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          . deps/install/native-debug/env.sh
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: |
          . deps/install/native-debug/env.sh
          cargo nextest run --workspace --no-tests=pass
