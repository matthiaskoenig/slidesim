# Spike (throwaway): spade CDT + PETSc DMAdaptMetric with Mmg, natively and in wasm32-wasip1.
# Not a member of the root workspace (it excludes spike/); built by run.sh.
[workspace]

[package]
name = "lobule-spike"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "lobule"
path = "src/main.rs"

[dependencies]
libm = "0.2"
spade = "2.15.1"

[build-dependencies]
bindgen = "0.73.2"

[profile.release]
debug = false
