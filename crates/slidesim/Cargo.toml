[package]
name = "slidesim"
description = "The slidesim command line: runs a study/1 end to end"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
cells = { path = "../cells" }
ceed = { path = "../ceed" }
clap = { version = "4", features = ["derive"] }
contracts = { path = "../contracts" }
maps = { path = "../maps" }
mesh = { path = "../mesh" }
mesher = { path = "../mesher" }
pde = { path = "../pde" }
petsc = { path = "../petsc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
test-support = { path = "../test-support" }
