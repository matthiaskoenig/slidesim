[package]
name = "slidesim"
description = "The slidesim command line: runs a study/1 end to end"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
contracts = { path = "../contracts" }
mesh = { path = "../mesh" }
mesher = { path = "../mesher" }
petsc = { path = "../petsc" }
serde_json = "1"
simulation = { path = "../simulation" }

[dev-dependencies]
serde_json = "1"
test-support = { path = "../test-support" }
