[package]
name = "cells"
description = "Cell models per coarse element: parameters from the maps, solved on sbmlsim-core's engine or as a libCEED QFunction"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ceed = { path = "../ceed" }
contracts = { path = "../contracts" }
maps = { path = "../maps" }
mesh = { path = "../mesh" }
pde = { path = "../pde" }
petsc = { path = "../petsc" }
sbmlsim-abi.workspace = true
sbmlsim-c = { workspace = true, optional = true }
sbmlsim-engine = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[features]
default = ["native"]
# The engine and the batched paths, on the cell model compiled to native code (sbmlsim-core's C
# target and engine). Without it (the browser build) the cells run on sbmlsim-core's batched
# kernel, a WebAssembly module the host links (`KernelCells`).
native = ["dep:sbmlsim-c", "dep:sbmlsim-engine"]

[dev-dependencies]
serde_json = "1"
test-support = { path = "../test-support" }
