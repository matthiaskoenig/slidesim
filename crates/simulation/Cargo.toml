[package]
name = "simulation"
description = "A study/1 as a simulation: the fields, the flow and the cells stepped from output to output, in memory"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
cells = { path = "../cells" }
ceed = { path = "../ceed" }
contracts = { path = "../contracts" }
maps = { path = "../maps" }
mesh = { path = "../mesh" }
mesher = { path = "../mesher" }
pde = { path = "../pde" }
petsc = { path = "../petsc" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
