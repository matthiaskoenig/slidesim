[package]
name = "pde"
description = "P1 finite elements on DMPlex with matrix-free libCEED operators"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ceed = { path = "../ceed" }
# Direct dependency for `DEP_CEED_INCLUDE` (libCEED's headers) in build.rs.
ceed-sys.workspace = true
contracts = { path = "../contracts" }
maps = { path = "../maps" }
mesh = { path = "../mesh" }
petsc = { path = "../petsc" }
thiserror = "2"

[dev-dependencies]
test-support = { path = "../test-support" }

[build-dependencies]
cc.workspace = true
