# cargo-nextest: one process per test (each initializes PETSc and MPI once).

[profile.default]
# A test which hangs fails: reported as slow after a minute, ended after ten. Longer than the
# timeouts of the runs under mpiexec (test-support's PARALLEL_TIMEOUT, the TIMEOUT of the CLI
# tests), which end a hanging mpiexec with all its processes first.
slow-timeout = { period = "60s", terminate-after = 10 }

# Tests which start mpiexec run alone. MPI processes poll while they wait for each other (MPICH
# never yields the CPU), so a process which loses its CPU to another test stalls all the others.
# On 4 CPUs, a multigrid test on 3 MPICH processes took 2 s alone and 214 s beside 3 busy
# processes; in CI it timed out beside one other test.
[[profile.default.overrides]]
filter = """
test(=parallel_on_2_processes) | test(=parallel_on_3_processes) \
| test(=two_processes_match_one) | test(=abort_ends_every_process) \
| test(=panic_ends_every_process) | test(=balanced_cells_match_unbalanced) \
| test(=balance_evens_the_work) | binary_id(slidesim::cli)\
"""
threads-required = "num-test-threads"
