[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spike"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
bindgen = "0.73.2"
cc = "1.2.41"
ceed-sys = { path = "crates/ceed-sys" }
petsc-sys = { path = "crates/petsc-sys" }
# The mesher: exact predicates, the R-tree of the size field and the constrained Delaunay
# triangulation. spade is pinned exactly: a patch release may change its refinement, and the
# generated meshes are to stay the same.
robust = "1.2.0"
rstar = "0.14.0"
spade = "=2.15.1"
# sbmlsim-core's C target and engine from `develop` (0.31.0 plus pull request #119, the attempts of
# the QFunction per application) until a release contains #119: the cell models as native code.
sbmlsim-abi = { git = "https://github.com/matthiaskoenig/sbmlsim-core", rev = "85bfa545db7459ff16cbd9baab293ae26a95c0c0" }
sbmlsim-c = { git = "https://github.com/matthiaskoenig/sbmlsim-core", rev = "85bfa545db7459ff16cbd9baab293ae26a95c0c0" }
sbmlsim-engine = { git = "https://github.com/matthiaskoenig/sbmlsim-core", rev = "85bfa545db7459ff16cbd9baab293ae26a95c0c0" }
