[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spike"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
bindgen = "0.73.2"
cc = "1.2.41"
ceed-sys = { path = "crates/ceed-sys" }
petsc-sys = { path = "crates/petsc-sys" }
# sbmlsim-core's C target and engine, from the branch `feat/c-target` (pull request #111) until
# its release: the cell models as native code, without WebAssembly.
sbmlsim-abi = { git = "https://github.com/matthiaskoenig/sbmlsim-core", rev = "c48b44ba8868d1734a7dd7be3b59268f0182873c" }
sbmlsim-c = { git = "https://github.com/matthiaskoenig/sbmlsim-core", rev = "c48b44ba8868d1734a7dd7be3b59268f0182873c" }
sbmlsim-engine = { git = "https://github.com/matthiaskoenig/sbmlsim-core", rev = "c48b44ba8868d1734a7dd7be3b59268f0182873c" }
